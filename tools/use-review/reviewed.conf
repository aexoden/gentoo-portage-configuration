# use-review ledger: flags that have been looked at and deliberately left at
# their default. Same syntax as package.use, but the flags carry no state; a
# trailing comment is shown as the reason. package.use entries (with or without
# "-") already count as decisions and do not need to be repeated here.
#
#   cat/pkg   flag [flag...]   # reason
#   */*       flag [flag...]   # reason (applies to every package)
